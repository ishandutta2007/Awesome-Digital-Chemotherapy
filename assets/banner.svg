<svg fill="none" viewBox="0 0 1200 340" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#161b33"/>
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    /* Animated Wave / Flow */
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }
    @keyframes floatOrb1 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.35; }
      50% { transform: translate(30px, -20px) scale(1.15); opacity: 0.6; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.35; }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0, 0) scale(1.1); opacity: 0.3; }
      50% { transform: translate(-25px, 25px) scale(0.9); opacity: 0.55; }
      100% { transform: translate(0, 0) scale(1.1); opacity: 0.3; }
    }
    @keyframes pulseCard {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }
    .anim-wave {
      animation: waveMove 10s ease-in-out infinite;
    }
    .anim-orb-1 {
      animation: floatOrb1 8s ease-in-out infinite;
    }
    .anim-orb-2 {
      animation: floatOrb2 9s ease-in-out infinite;
    }
    .anim-card-1 {
      animation: pulseCard 6s ease-in-out infinite;
    }
    .anim-card-2 {
      animation: pulseCard 7s ease-in-out infinite 1s;
    }
    .anim-card-3 {
      animation: pulseCard 6.5s ease-in-out infinite 2s;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200 M0 320 H1200" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4 6"/>
    <path d="M80 0 V340 M160 0 V340 M240 0 V340 M320 0 V340 M400 0 V340 M480 0 V340 M560 0 V340 M640 0 V340 M720 0 V340 M800 0 V340 M880 0 V340 M960 0 V340 M1040 0 V340 M1120 0 V340" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4 6"/>
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="anim-orb-1" cx="980" cy="100" r="140" fill="url(#glow-grad)" filter="url(#glow)"/>
  <circle class="anim-orb-2" cx="1100" cy="240" r="160" fill="url(#glow-grad)" filter="url(#glow)"/>
  <circle class="anim-orb-1" cx="200" cy="280" r="100" fill="url(#glow-grad)" filter="url(#glow)"/>

  <!-- Dynamic ECG / Chemotherapy Flow Waves (Kept low & right to never obscure text) -->
  <g class="anim-wave" opacity="0.35">
    <path d="M 680,260 Q 750,220 820,260 T 960,260 T 1100,260 T 1240,260" fill="none" stroke="url(#pulse-grad)" stroke-width="3" />
    <path d="M 700,285 Q 770,250 840,285 T 980,285 T 1120,285 T 1260,285" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/>
  </g>

  <!-- Dynamic Graphic Pills / Flow Elements (Right Side Decorative Area) -->
  <g transform="translate(850, 45)">
    <!-- Card 1: Dose Calculation -->
    <g class="anim-card-1">
      <rect x="0" y="0" width="280" height="60" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="15" fill="#0284c7" fill-opacity="0.2"/>
      <path d="M 24 30 L 28 34 L 36 26" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="27" class="badge-text" fill="#f8fafc">AI Dose &amp; BSA Calculation</text>
      <text x="60" y="46" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">AUC • Calvert • Mosteller • BSA</text>
    </g>

    <!-- Card 2: Chemotherapy Regimens -->
    <g class="anim-card-2" transform="translate(25, 76)">
      <rect x="0" y="0" width="275" height="60" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="15" fill="#9333ea" fill-opacity="0.2"/>
      <circle cx="30" cy="30" r="7" fill="#a855f7"/>
      <text x="60" y="27" class="badge-text" fill="#f8fafc">Protocol Verification &amp; CDS</text>
      <text x="60" y="46" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">NCCN • HemOnc • SACT Protocols</text>
    </g>

    <!-- Card 3: Oncology EHR & Analytics -->
    <g class="anim-card-3" transform="translate(-10, 152)">
      <rect x="0" y="0" width="285" height="60" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="15" fill="#10b981" fill-opacity="0.2"/>
      <path d="M 23 35 L 27 28 L 32 31 L 37 23" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
      <text x="60" y="27" class="badge-text" fill="#f8fafc">OIS &amp; Clinical Data Systems</text>
      <text x="60" y="46" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Cloud EHR • Infusion Management</text>
    </g>
  </g>

  <!-- Foreground Content (Left Aligned, Clear & Pristine Visibility) -->
  <g transform="translate(60, 0)">
    <!-- Tagline Pill -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="270" height="28" rx="14" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#38bdf8"/>
      <text x="28" y="19" class="tagline">Oncology &amp; Digital Health</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="132" class="title">
      Awesome <tspan fill="url(#primary-grad)">Digital Chemotherapy</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">
      Curated Ecosystem of Oncology Platforms, Dose Calculators &amp; Clinical Systems
    </text>

    <!-- Category Highlights Pills / Badges in Foreground -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="168" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="22" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">💊 Regimen Prescribing</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="162" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
        <text x="20" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#818cf8">⚖️ Dose Calculation</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(354, 0)">
        <rect x="0" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
        <text x="20" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🏥 Oncology EHR / OIS</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(536, 0)">
        <rect x="0" y="0" width="156" height="36" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
        <text x="20" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#34d399">🔬 Open-Source CDS</text>
      </g>
    </g>

    <!-- Bottom Metadata / Info -->
    <text x="0" y="292" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b" font-weight="500">
      ⚡ Comprehensive Directory • Commercial SaaS &amp; Open-Source Platforms • Evidence-Based Care
    </text>
  </g>
</svg>
